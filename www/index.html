<style>
/* Layout: one phone-width column. Header, three views (calendar, upcoming, tasks), fixed tab bar, bottom sheets for detail/add/settings. */
:root{
  --bg:#f5f5f8; --surface:#ffffff; --surface2:#eceef3; --ink:#15161c; --muted:#686b79; --line:#e0e2ea;
  --accent:#4a4cdf; --accent-ink:#ffffff; --danger:#cf3a3a; --ok:#1c9a60; --scrim:rgba(14,15,22,.45);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f15; --surface:#171922; --surface2:#20232d; --ink:#eceef5; --muted:#9a9eae; --line:#2a2d3a;
  --accent:#8e90ff; --accent-ink:#0e0f15; --danger:#ff7b7b; --ok:#4cc68d; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-bottom:112px}

.banner{display:flex;gap:10px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;margin:6px 0 4px;font-weight:500}
.banner span{flex:1;min-width:0}
.banner button{font-weight:600;text-decoration:underline}

.monthbar h2{font-size:19px;flex:1}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px}
.sec h3{font-size:15px}
.sec small{color:var(--muted);font-size:12px}

.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;min-width:0}

.tile svg{width:22px;height:22px}
.card .txt{flex:1;min-width:0}

.card .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}

.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:2px}
.empty{color:var(--muted);text-align:center;padding:26px 12px;border:1px dashed var(--line);border-radius:16px}
.next{border-radius:20px;padding:18px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));width:100%;text-align:left;display:block}
.next .big{font-family:var(--font-head);font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.next .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.trow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}

.trow.done span.t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:14px;height:14px;stroke-width:3}
.done .chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.xbtn{color:var(--muted);width:28px;height:28px;display:grid;place-items:center;border-radius:8px;flex:none}
.xbtn svg{width:16px;height:16px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));

.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0;border-radius:10px}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:26px;height:26px;stroke-width:2.2}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}
.hero{border-radius:20px;padding:16px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));margin-top:8px}
.hero .row{display:flex;gap:12px;align-items:flex-start}
.hero .tile{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff}
.hero .tile svg{width:28px;height:28px}
.hero h2{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.hero .code{color:var(--muted);font-size:13px;margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.fact.wide{grid-column:1/-1}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact .v{font-family:var(--font-head);font-size:20px;font-weight:600;margin-top:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.fact .v.sm{font-size:16px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin:16px 0 10px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.btn{height:46px;border-radius:13px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1;min-width:140px}
.swatches,.icons{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.ib{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.ib[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:8px}
.note .nt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{color:var(--muted);display:block;margin-top:4px;font-size:11.5px}
.hint{color:var(--muted);font-size:13px}
.msg{font-size:13px;margin:8px 0;color:var(--muted)}
.msg.err{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,420px);animation:fade .2s ease}
.rev{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rev .chk{margin-top:2px}
.rev.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

      try{
        const arr=await sample.json(prompt,Object.assign({signal:ctl.signal},imgs?{images:imgs}:{}));
        const items=(Array.isArray(arr)?arr:[arr]).filter(x=>x&&parseYmd(x.date)).map(x=>({title:String(x.title||"Untitled exam").slice(0,120),code:String(x.code||"").slice(0,30),room:String(x.room||"").slice(0,30),date:x.date,start:/^\d{1,2}:\d{2}$/.test(x.start)?pad2(x.start):"09:00",end:/^\d{1,2}:\d{2}$/.test(x.end)?pad2(x.end):"11:00",notes:String(x.notes||"").slice(0,400)}));
        msg.textContent="";
        if(!items.length){msg.className="msg err";msg.textContent="No exams with a clear date were found. Add the dates and try again.";return}
        review(items);
      }catch(err){
        msg.textContent="";
        if(err&&err.code==="cancelled")return;
        msg.className="msg err";
        msg.textContent=err&&err.code==="not_granted"?"Allow Claude for this page to use AI arranging, or add exams manually.":err&&err.code==="rate_limited"?"Too many requests right now. Try again in a bit.":err&&err.code==="invalid_json"?"Couldn't make sense of that schedule. Try fewer lines or clearer dates.":"Something went wrong reading the schedule. Try again.";
      }finally{go.disabled=false;go.textContent="";go.append(ic("spark"),"Arrange my schedule")}
    }
    function pad2(s){const [a,b]=s.split(":");return pad(Math.min(23,+a))+":"+pad(Math.min(59,+b))}
    function review(items){
      const on=items.map(()=>true);result.textContent="";
      const list=h("div");
      const addBtn=h("button",{class:"btn block",id:"impAdd"});
      function paint(){list.textContent="";
        items.forEach((x,i)=>list.append(h("button",{class:"rev"+(on[i]?" on":""),style:"width:100%;text-align:left",onclick:()=>{on[i]=!on[i];paint()}},
          h("span",{class:"chk"},ic("check")),
          h("span",{style:"flex:1;min-width:0"},h("div",{style:"font-weight:600;overflow-wrap:anywhere"},x.title),
            h("div",{class:"hint"},dateLong(parseYmd(x.date))+" · "+t12(x.start)+" – "+t12(x.end)+(x.room?" · Room "+x.room:""))))));
        const n=on.filter(Boolean).length;addBtn.disabled=!n;addBtn.textContent="Add "+n+" exam"+(n===1?"":"s")}
      addBtn.onclick=()=>{
        const chosen=items.filter((_,i)=>on[i]);if(!chosen.length)return;
        S.exams=S.exams.filter(x=>!x.example);
        chosen.forEach((x,i)=>S.exams.push({id:uid(),title:x.title,code:x.code,room:x.room,date:x.date,start:x.start,end:x.end<=x.start?x.start:x.end,color:COLORS[(S.exams.length)%COLORS.length],icon:guessIcon(x.title),remind:null,notes:x.notes?[{id:uid(),text:x.notes,ts:Date.now()}]:[],tasks:[]}));
        const f=chosen.map(x=>x.date).sort()[0],d=parseYmd(f);sel=f;cursor=new Date(d.getFullYear(),d.getMonth(),1);
        save();closeSheet();setView("cal");toast(chosen.length+" exam"+(chosen.length===1?"":"s")+" added");checkReminders();
      };
      result.append(h("div",{class:"sec"},h("h3",null,"Found "+items.length),h("small",null,"Tap to include or skip")),list,addBtn);paint();
    }
  });
}

/* ---------- settings ---------- */
function openSettings(){
  openSheet(sheet=>{
    const sel2=h("select",{class:"in",id:"sLead"},leadOptions(S.lead,false));
    sel2.addEventListener("change",()=>{S.lead=Number(sel2.value);save();toast("Default reminder: "+leadLabel(S.lead))});
    const custom=h("input",{class:"in",id:"sCustom",type:"number",min:"0",max:"10080",placeholder:"Custom minutes, e.g. 90",inputmode:"numeric"});
    const cbtn=h("button",{class:"btn alt",id:"sCustomSet",onclick:()=>{const v=Math.round(Number(custom.value));if(!(v>=0&&v<=10080)){toast("Enter minutes from 0 to 10080");return}S.lead=v;save();toast("Default reminder: "+leadLabel(S.lead));openSettings()}},"Set");
    const perm=h("div",{class:"hint",id:"sPerm"});
    const supported=(()=>{try{return "Notification" in window}catch(e){return false}})();
    function permText(){let p="unsupported";try{if(supported)p=Notification.permission}catch(e){}
      perm.textContent=p==="granted"?"Phone and desktop notifications are on while this page is open.":p==="denied"?"Notifications are blocked for this page. Reminders still show inside the app.":p==="default"?"Turn on notifications to get alerts while this page is open in the background.":"This view can't send system notifications. Reminders show inside the app."}
    permText();
    const nbtn=h("button",{class:"btn alt",id:"sNotify",onclick:async()=>{try{await Notification.requestPermission()}catch(e){}permText()}},ic("bell"),"Turn on notifications");
    if(!supported)nbtn.hidden=true;
    const hasEx=S.exams.some(e=>e.example);
    sheet.append(h("div",{class:"sec",style:"margin-top:8px"},h("h2",{style:"font-size:20px"},"Reminders"),h("button",{class:"icon-btn","aria-label":"Close",onclick:closeSheet},ic("x"))),
      h("label",{class:"field"},h("span",null,"Default reminder for every exam"),sel2),
      h("div",{style:"display:flex;gap:8px;margin-bottom:6px"},custom,cbtn),
      h("p",{class:"hint",style:"margin:10px 0"},"You can change the reminder for any single exam from its detail view."),
      perm,h("div",{style:"margin-top:8px"},nbtn),
      h("div",{class:"sec"},h("h3",null,"Alerts when the app is closed")),
      h("p",{class:"hint",style:"margin:0 0 10px"},"Reminders ring while Exam Desk is open. To get phone alerts any time, save your schedule as a file, import it into Google Calendar or your phone calendar, and set the alert there."),
      h("div",{class:"actions",style:"margin-top:0"},h("button",{class:"btn alt",id:"sExport",onclick:()=>{const l=sorted().filter(e=>!e.example);if(!l.length){toast("Add your own exams first");return}exportCsv(l)}},ic("dl"),"Save schedule for calendar")),
      hasEx?h("div",{class:"actions"},h("button",{class:"btn danger",id:"sClear",onclick:()=>{S.exams=S.exams.filter(e=>!e.example);save();toast("Examples removed");closeSheet()}},"Remove example exams")):null);
  });
}

/* ---------- reminder engine ---------- */
const alerts=[];
function paintAlerts(){const slot=$("alertSlot");slot.textContent="";
  alerts.forEach(a=>slot.append(h("div",{class:"banner",role:"alert"},ic("bell"),h("span",null,a.text),
    h("button",{onclick:()=>{alerts.splice(alerts.indexOf(a),1);paintAlerts();openDetail(a.id)}},"View"),
    h("button",{"aria-label":"Dismiss",onclick:()=>{alerts.splice(alerts.indexOf(a),1);paintAlerts()}},ic("x")))))}
function checkReminders(){
  const now=Date.now();let changed=false;
  S.exams.forEach(e=>{
    const lead=leadOf(e);if(lead<0)return;
    const st=startOf(e).getTime(),fire=st-lead*60000,key=e.id+"|"+e.date+"|"+e.start+"|"+lead;
    if(now>=fire&&now<st&&!S.notified[key]){
      S.notified[key]=now;changed=true;
      const text=e.title+" starts in "+eta(st-now)+(e.room?" · Room "+e.room:"");
      alerts.push({id:e.id,text});paintAlerts();
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Exam reminder",{body:text})}catch(err){}
    }});
  const old=now-14*864e5;for(const k in S.notified)if(S.notified[k]<old){delete S.notified[k];changed=true}
  if(changed)save();
}

/* ---------- start ---------- */
function init(){
  $("btnSettings").append(ic("bell"));$("btnAdd").append(ic("plus"));
  $("tab-cal").append(ic("cal"),"Calendar");$("tab-up").append(ic("list"),"Upcoming");$("tab-tasks").append(ic("tasks"),"Tasks");
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
  $("btnAdd").addEventListener("click",()=>openForm(null));$("btnSettings").addEventListener("click",openSettings);
  document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("layer").firstChild)closeSheet()});
  render();
  load().then(()=>{const d=new Date();sel=ymd(d);cursor=new Date(d.getFullYear(),d.getMonth(),1);render();checkReminders()});
  setInterval(()=>{checkReminders();if(!$("layer").firstChild&&view!=="cal")render()},20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkReminders()});
}
init();
})();
</script>
